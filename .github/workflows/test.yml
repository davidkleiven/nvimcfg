name: test
on: [push, pull_request]

jobs:
  envrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install plenary.nvim
        run: git clone --depth 1 https://github.com/nvim-lua/plenary.nvim ${{ runner.temp }}/plenary

      - name: Run envrun tests
        env:
          ENVRUN_REPO: ${{ github.workspace }}
          ENVRUN_PLENARY: ${{ runner.temp }}/plenary
        run: make test
